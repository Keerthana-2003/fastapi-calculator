<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | FastAPI Calculator</title>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #0b1221; color: #f5f7ff; display: grid; place-items: center; height: 100vh; margin: 0; }
    .card { width: min(420px, 92vw); background: linear-gradient(145deg, #121b31, #0f172a); border: 1px solid #1f2a44; border-radius: 16px; padding: 24px; box-shadow: 0 24px 64px rgba(0,0,0,0.35); }
    h1 { margin: 0 0 16px; font-size: 24px; letter-spacing: 0.5px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 14px; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #24304c; background: #0c1324; color: #f5f7ff; font-size: 14px; }
    input:focus { outline: 2px solid #5b8def; border-color: #5b8def; }
    button { width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(120deg, #5b8def, #7bd6f6); color: #0b1221; font-weight: 700; cursor: pointer; box-shadow: 0 10px 30px rgba(91, 141, 239, 0.35); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 14px; min-height: 20px; }
    .status.ok { color: #8af6c8; }
    .status.err { color: #ff9b9b; }
    .inline { display: flex; gap: 12px; }
    .inline .half { flex: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create your account</h1>
    <form id="register-form" novalidate>
      <div class="inline">
        <div class="half">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="50" required />
        </div>
        <div class="half">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
      </div>
      <label for="password">Password (min 6 chars)</label>
      <input id="password" name="password" type="password" minlength="6" required />

      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" minlength="6" required />

      <button id="submit" type="submit">Register</button>
      <div id="status" class="status"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit');

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function setStatus(message, ok = false) {
      statusEl.textContent = message;
      statusEl.className = ok ? 'status ok' : 'status err';
    }

    function validateFields({ username, email, password, confirm }) {
      if (!username || username.length < 3) return 'Username must be at least 3 characters';
      if (!emailRegex.test(email)) return 'Enter a valid email address';
      if (!password || password.length < 6) return 'Password must be at least 6 characters';
      if (password !== confirm) return 'Passwords must match';
      return '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setStatus('');

      const payload = {
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };
      const confirm = document.getElementById('confirm').value;

      const validationError = validateFields({ ...payload, confirm });
      if (validationError) {
        setStatus(validationError, false);
        return;
      }

      submitBtn.disabled = true;
      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', accept: 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setStatus(data.detail || 'Registration failed', false);
          return;
        }

        if (data.access_token) {
          localStorage.setItem('access_token', data.access_token);
        }
        setStatus('Registration successful! Token stored locally.', true);
      } catch (err) {
        setStatus('Network error, please try again.', false);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
